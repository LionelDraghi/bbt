name = "todomvc_gtk4"
description = "ToDoMVC witness app (GTK4), for the bbt GUI vocabulary"
version = "0.1.0-dev"

authors = ["Lionel Draghi"]
maintainers = ["Lionel Draghi <lionel.draghi@free.fr>"]
maintainers-logins = ["LionelDraghi"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/LionelDraghi/bbt"

executables = ["todomvc"]

[[depends-on]]
gtkada4 = "^27.0.0"

# The commit, not the branch: a branch pin makes the build follow
# AdaCore's main, and the GtkAda project file of the day can stop
# parsing with the gprbuild the CI installs (26.0.1 rejects the
# variable declarations of the 2026-11-27 main, gtkada.gpr:49). The
# 2026-11-04 merge builds with it.
[[pins]]
gtkada4 = { url = "https://github.com/AdaCore/gtkada", commit = "40f1f506fd8655d3b9c5508e6f5a1cbe7bc42cd4" }
