# Build using Alire and upload an AppImage to the GitHub releases section.
name: Build and upload AppImage

on:                    # Run the workflow for each of the following events:
  push:                # - A branch is pushed or updated.
    branches:
      - main
    paths: &trigger_paths
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/features/**'
      - 'docs/examples/**'
      - 'docs/help/**'
      - 'Makefile'
      - 'alire.toml'
  
  pull_request:        # - A pull-request is opened or updated.
    paths: *trigger_paths

  workflow_dispatch:   # - A manual run of the workflow is requested from the GitHub web interface.

  # No release trigger: on a release event, github.ref is refs/tags/x.y.z,
  # which alr2appimage-action passes as target_commitish to the
  # create-release API, which rejects it (422), so the run would fail on
  # every release; the continuous AppImage is refreshed by the push runs.

permissions: write-all

jobs:
  release:
    name: Continuous
    runs-on: ubuntu-22.04 # Use the oldest supported ubuntu version for greater compatibility.
    if: github.event_name != 'pull_request'
    # The AppImage release upload is only meaningful on main pushes:
    # on a pull request, the release creation fails with an
    # invalid tag_name / target_commitish (the merge ref is not a valid
    # release target), and the check was reported as a PR failure.
    steps:
       - name: Checkout
         uses: actions/checkout@v2
       - name: Clone the pinned sibling crate
         # alire.toml pins list_image to a sibling directory (../list_image)
         # during development, and alr2appimage-action runs `alr build` in
         # the local workspace: clone it next to the bbt checkout so that
         # the pin resolves (same clone as in build-test.yml).
         shell: bash
         run: |
           git clone --depth 1 --branch master https://github.com/LionelDraghi/List_Image ../list_image
       - name: alr2appimage-action
         uses: mgrojo/alr2appimage-action@main
         with:
             alireVersion: "nightly"
             alr2appimageArgs: "--use-version --terminal"
             ### tagName: "${{ github.ref_name }}-continuous
