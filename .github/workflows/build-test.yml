name: Build and test

on:                    # Run the workflow for each of the following events:
  push:                # - The main branch is pushed or updated.
    branches:
      - main
    paths: &trigger_paths
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/features/**'
      - 'docs/examples/**'
      - 'Makefile'
      - 'alire.toml'

  pull_request:        # - A pull-request is opened or updated.
    paths: *trigger_paths
    
  workflow_dispatch:   # - A manual run of the workflow is requested from the GitHub web interface.
  
  release:
    types: [created]   # - A release is created.

permissions: write-all

jobs:
  main:
    strategy:
      fail-fast: false # Don't stop all the workflows when one of them fails.
    
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # List of GitHub Actions platform to run the workflow on
    env:
      #  set the value of the environment variable OS_PLATFORM according to the runner OS
      OS_PLATFORM: ${{ matrix.os == 'windows-latest' && 'Windows' || matrix.os == 'ubuntu-latest' && 'Linux' || matrix.os == 'macos-latest' && 'Darwin' || 'Unknown' }}
    runs-on: ${{ matrix.os }} # Run the continuous integration workflow on each OS listed in the matrix.
    
    steps:
        # Check-out the repository
      - uses: actions/checkout@v3

        # Install and setup Alire package manager
      - uses: alire-project/setup-alire@v5
        # with:
        #   version: 2.1.0 # Remove this option to use the default (latest stable release)

      - name: Cache Alire dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/alire
            ~/.local/share/alire
          key: ${{ runner.os }}-alire-${{ hashFiles('alire.toml') }}
          restore-keys: |
            ${{ runner.os }}-alire-

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-mlc
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup tools (mlc)
        # Note: On Windows runners, bash is available via Git for Windows (which includes MSYS2).
        # This allows using the same bash script across all platforms.
        # rpl is no more installed from external sources: the local rpl,
        # built by the tools target, is used.
        shell: bash
        run: |
          # Install mlc if not present
          if ! command -v mlc >/dev/null 2>&1; then
            cargo install --locked mlc
          else
            echo "mlc already installed"
          fi

      - name: Run build and checks
        env:
          GNAT_FILE_NAME_CASE_SENSITIVE: ${{ matrix.os == 'macos-latest' && '1' || '' }}
          # cf. https://forum.ada-lang.io/t/name-file-casing-error-on-darwin/1795
        run: make -k

      - name: macOS stack diagnostics
        #  Diagnose the macOS stack overflow seen on A280: run a long series
        #  of trivial commands in a single bbt run to measure a possible
        #  per command stack growth, and check whether A280 passes alone.
        #  Results are published as annotations, so that they are readable
        #  from the checks API without the job log.
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          echo "stack limit: $(ulimit -s)"
          { echo "# Diagnostic: stack growth per command"
            for i in $(seq 1 500); do
              echo
              echo "## Scenario: run $i"
              echo "- When I run \`./sut -v\`"
              echo "- Then I get no error"
            done; } > tests/stack_diag.md
          { echo "# Diagnostic: stack growth per step, without any command"
            for i in $(seq 1 500); do
              echo
              echo "## Scenario: check $i"
              echo "- Given there is no \`to_check_$i\` file"
              echo "- Then there is no \`to_check_$i\` file"
            done; } > tests/step_diag.md
          cd tests
          DIAG=$(./bbt --yes stack_diag.md 2>&1 || true)
          LAST=$(echo "$DIAG" | grep -E 'Summary' | tail -1 || true)
          if echo "$DIAG" | grep -q "stack overflow"; then
            EXC=$(echo "$DIAG" | grep -E 'Exception' | tail -1 || true)
            echo "::error title=macos-diag-run::stack overflow in the long run test: $LAST -- at $EXC"
          else
            echo "::warning title=macos-diag-run::no stack overflow in the long run test: $LAST"
          fi
          DIAG2=$(./bbt --yes step_diag.md 2>&1 || true)
          LAST2=$(echo "$DIAG2" | grep -E 'Summary' | tail -1 || true)
          if echo "$DIAG2" | grep -q "stack overflow"; then
            EXC2=$(echo "$DIAG2" | grep -E 'Exception' | tail -1 || true)
            echo "::error title=macos-diag-step::stack overflow without any command: $LAST2 -- at $EXC2"
          else
            echo "::warning title=macos-diag-step::no stack overflow without any command: $LAST2"
          fi
          cd ..
          A280=$(cd tests && ./bbt --yes ../docs/features/A280_Given_Environment_Variable.md 2>&1 | grep -E 'Summary' | tail -1)
          echo "::warning title=macos-diag::A280 standalone: $A280"
        
      - name: Save summary
        if: always()
        run: cat docs/tests_results/${OS_PLATFORM}/features_results.md >> ${GITHUB_STEP_SUMMARY} || echo "no results available"
        shell: bash

      - name: tests results publishing
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: docs/tests_results/${{ env.OS_PLATFORM }}/features_results.xml
