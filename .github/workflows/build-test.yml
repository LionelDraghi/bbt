name: Build and test

on:                    # Run the workflow for each of the following events:
  push:                # - The main branch is pushed or updated.
    branches:
      - main
    paths: &trigger_paths
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/features/**'
      - 'docs/examples/**'
      - '.github/workflows/**'
      - 'Makefile'
      - 'alire.toml'
      - 'bbt.gpr'

  pull_request:        # - A pull-request is opened or updated.
    paths: *trigger_paths
    
  workflow_dispatch:   # - A manual run of the workflow is requested from the GitHub web interface.
  
  release:
    types: [created]   # - A release is created.

permissions: write-all

concurrency:
  # A new push cancels the run still in flight: without this, overlapping
  # runs regenerate and publish the same results files, and fight over
  # them (the JUnit xml also changes at each run, as it contains the
  # execution times), making the publish step fail on rebase conflicts.
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set_badges_pending:
    # Before any build or test runs, turn the three platform badges and
    # the CI badge to a red "being tested" state and publish them, so
    # that a push where the build fails, or where the tests are not run
    # at all, never leaves in the README the badges of the previous run:
    # the badges will only turn blue again when the tests of the new
    # version pass. The GitHub-provided workflow badge cannot show an
    # in-progress state, so the CI badge used in the README is a file
    # committed in the repo, managed like the platform ones.
    # This is done in a separate job, and not in the first step of the
    # main jobs, so that a single commit sets all the badges, and
    # the parallel main jobs don't fight over the initial publication.
    name: Set badges to pending
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    # Never prevent the tests from running because of a failure here
    # (shields.io unreachable, push rejected, ...): the badges would then
    # stay in their previous state, which is not worse than before.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish red pending badges
        shell: bash
        run: |
          for P in Linux Darwin Windows CI; do
            curl -sf "https://img.shields.io/badge/${P}-being%20tested-red.svg?style=flat-square" \
              -o docs/tests_results/${P}/badge.svg
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tests_results/*/badge.svg
          if git diff --cached --quiet; then
            echo "Badges already pending, nothing to publish"
            exit 0
          fi
          git commit -m "CI: set test badges to pending [skip ci]"
          # Retry with rebase if someone pushed on main in between.
          for i in 1 2 3 4 5; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              echo "Pending badges published"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $i), retrying after a delay"
            sleep $((i * 10))
          done
          echo "Could not publish pending badges"
          exit 1

  main:
    needs: set_badges_pending
    # Run even when set_badges_pending was skipped (pull-requests) or
    # failed: the tests are the priority, the badges are only cosmetic.
    if: always()
    strategy:
      fail-fast: false # Don't stop all the workflows when one of them fails.
    
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15] # List of GitHub Actions platform to run the workflow on
        # macos-15, not macos-latest: the macOS 26 (Tahoe) image ships
        # Command Line Tools 26.6, whose SDK .tbd stubs list the arm64e.x1
        # targets; the linker bundled with every GNAT FSF toolchain (15.x
        # and 16.x alike) rejects them and every link fails with
        # "malformed file libSystem.tbd" and undefined libc symbols
        # (cf. https://github.com/alire-project/GNAT-FSF-builds/issues/112).
        # Switch back to macos-latest once the toolchain linker is fixed.
    env:
      #  set the value of the environment variable OS_PLATFORM according to the runner OS
      OS_PLATFORM: ${{ matrix.os == 'windows-latest' && 'Windows' || matrix.os == 'ubuntu-latest' && 'Linux' || startsWith(matrix.os, 'macos') && 'Darwin' || 'Unknown' }}
    runs-on: ${{ matrix.os }} # Run the continuous integration workflow on each OS listed in the matrix.
    
    steps:
        # Check-out the repository
      - uses: actions/checkout@v4
        with:
          # On main pushes, check out the tip of main instead of the pushed
          # commit: the set_badges_pending job has just published the red
          # pending badges there, and starting from that tip is required
          # for the publish step to commit the regenerated blue badges
          # again (a file identical to the checked out one is not part of
          # the commit). On other events (pull-requests, releases), the
          # default ref is used.
          ref: ${{ github.event_name == 'push' && 'main' || github.ref }}

        # Install and setup Alire package manager
      - uses: alire-project/setup-alire@v5
        with:
          # Same version as the local development environment.
          version: 2.1.1

      - name: Relocate the Alire cache on Windows
        # The alr GNAT runtime copies files through a 256-character path
        # buffer: with the default cache under %LOCALAPPDATA%\alire\cache,
        # the build dir of dependencies with deep trees, such as sparklib,
        # exceeds it and `alr build` fails with "Could not sync build dir"
        # (cf. https://github.com/alire-project/alire/issues/1762).
        # A short cache root keeps every path under the limit.
        if: runner.os == 'Windows'
        run: alr settings --global --set cache.dir C:\alr-cache

      - name: Cache Alire dependencies
        uses: actions/cache@v4
        with:
          # On Linux, alire data is in ~/.cache/alire and ~/.local/share/alire;
          # on Windows runners (runneradmin user), it is in %LOCALAPPDATA%\alire:
          # the Linux-only paths left the Windows toolchain out of the cache,
          # and it was fully re-downloaded on each run.
          # On Windows, the cache itself is relocated to C:\alr-cache
          # (cf. the relocation step above), and %LOCALAPPDATA%\alire keeps
          # only the settings and indexes.
          path: |
            ~/.cache/alire
            ~/.local/share/alire
            ~/AppData/Local/alire
            C:/alr-cache
          # The key and the restore prefix include the runner image,
          # not only the OS family: the cached binaries embed the
          # version of the SDK they were built against, and after the
          # macOS runner was pinned to macos-15, the cache saved on
          # the macOS 26 image kept being restored, the linker
          # warning on every link:
          # "was built for newer macOS version (26.0) than being
          # linked (15.0)". An image change must invalidate the cache.
          key: ${{ matrix.os }}-alire-${{ hashFiles('alire.toml') }}
          restore-keys: |
            ${{ matrix.os }}-alire-

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-mlc
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup tools (mlc)
        # Note: On Windows runners, bash is available via Git for Windows (which includes MSYS2).
        # This allows using the same bash script across all platforms.
        # rpl is no more installed from external sources: the local rpl,
        # built by the tools target, is used.
        shell: bash
        run: |
          # Install mlc if not present
          if ! command -v mlc >/dev/null 2>&1; then
            cargo install --locked mlc
          else
            echo "mlc already installed"
          fi

      - name: Run build and checks
        env:
          GNAT_FILE_NAME_CASE_SENSITIVE: ${{ startsWith(matrix.os, 'macos') && '1' || '' }}
          # cf. https://forum.ada-lang.io/t/name-file-casing-error-on-darwin/1795
        run: make -k

      - name: Save summary
        if: always()
        run: cat docs/tests_results/${OS_PLATFORM}/features_results.md >> ${GITHUB_STEP_SUMMARY} || echo "no results available"
        shell: bash

      - name: tests results publishing
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: docs/tests_results/${{ env.OS_PLATFORM }}/features_results.xml

      - name: Publish test results and badges
        # make -k above regenerated docs/tests_results/${OS_PLATFORM} in the
        # runner workspace, but did not commit it: publish it, so that the
        # badges shown in the README are updated by the CI, and not only by
        # a manual run on each platform. The publication happens even when
        # some tests fail, so that the badges reflect the actual status
        # (red when tests failed); only main is published, so that
        # pull-requests do not change the published status.
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tests_results/${OS_PLATFORM}
          if git diff --cached --quiet; then
            echo "No change in docs/tests_results/${OS_PLATFORM}, nothing to publish"
            exit 0
          fi
          git commit -m "CI: update ${OS_PLATFORM} test results and badges [skip ci]"
          # The three platforms run in parallel and push to the same branch:
          # retry with rebase if another platform pushed in between.
          # --autostash is required: the other regenerated files, outside
          # docs/tests_results (grammar.md, fixme_index.md, ...), are not
          # committed, and would make the rebase fail on unstaged changes.
          for i in 1 2 3 4 5; do
            if git fetch origin main && git rebase --autostash -X theirs origin/main && git push origin HEAD:main; then
              echo "Results and badges published"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $i), retrying after a delay"
            sleep $((i * 10))
          done
          echo "Could not publish ${OS_PLATFORM} test results"
          exit 1

  publish_ci_badge:
    # Publish the CI badge shown in the README from the aggregated
    # result of the main jobs. It is published from a separate job, and
    # not from within the main jobs, because the badge is per-workflow
    # run and not per-platform: publishing it from each platform job
    # would let a green platform overwrite the red badge published by
    # a failed one, depending on the publication order.
    name: Publish CI badge
    needs: main
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the tip of main, that the platform jobs may have
          # just updated, and not the pushed commit.
          ref: ${{ github.event_name == 'push' && 'main' || github.ref }}

      - name: Publish CI badge
        shell: bash
        run: |
          if [ "${{ needs.main.result }}" = "success" ]; then
            curl -sf "https://img.shields.io/badge/CI-passing-brightgreen.svg?style=flat-square" \
              -o docs/tests_results/CI/badge.svg
          else
            curl -sf "https://img.shields.io/badge/CI-failed-red.svg?style=flat-square" \
              -o docs/tests_results/CI/badge.svg
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tests_results/CI/badge.svg
          if git diff --cached --quiet; then
            echo "CI badge already up to date, nothing to publish"
            exit 0
          fi
          git commit -m "CI: publish CI badge [skip ci]"
          # Retry with rebase if someone pushed on main in between.
          for i in 1 2 3 4 5; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              echo "CI badge published"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $i), retrying after a delay"
            sleep $((i * 10))
          done
          echo "Could not publish the CI badge"
          exit 1
