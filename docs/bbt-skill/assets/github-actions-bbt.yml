name: bbt

on:
  push:
  pull_request:

jobs:
  bbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Alire
        run: |
          curl -fsSL https://alire.ada.dev/download | bash
          echo "$HOME/.alire/bin" >> $GITHUB_PATH

      - name: Install bbt
        run: alr install bbt

      - name: Run bbt scenarios
        # --scenario_timeout makes a hanging scenario fail fast
        # instead of blocking the job
        run: bbt --recursive --scenario_timeout 5m doc/scenario

      - name: check examples
        run: bbt README.md
