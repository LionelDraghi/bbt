<!doctype HTML>
<HTML>
   <HEAD>
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>bbt debugger</title>
      <script src="/js/jquery.min.js" type="text/javascript"></script>
      <script src="/js/boot.js" type="text/javascript"></script>
      <script src="/js/mermaid.min.js" type="text/javascript"></script>
      <script src="/js/page.js" type="text/javascript"></script>
      <style>
         body { font-family: sans-serif; margin: 10px; background: #fafafa; }
         #topbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            margin-bottom: 6px;
         }
         #topbar button { margin: 0; }
         /* Stop on error: a big toggle, green when armed (ON), blue
            when disarmed (OFF, not red: a disarmed switch is not a
            problem) — cf. the POC's #stop_on styling */
         #stop_toggle { font-weight: bold; }
         #stop_toggle.on { background: #2f855a; }
         #stop_toggle.on:hover { background: #276749; }
         #stop_toggle.off { background: #2b6cb0; }
         #stop_toggle.off:hover { background: #2a4d7f; }
         /* The status bar, editor style: just under the buttons, the
            location line on the left, progress in the middle, run
            status on the right. The POC's #statusbar styling,
            migrated. */
         #statusbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 5px 10px;
            background: #e2e8f0;
            border-bottom: 1px solid #cbd5e0;
            margin-bottom: 10px;
            font-size: small;
         }
         #statusbar .loc { margin: 0; color: #2d3748; }
         #statusbar .status { margin: 0 0 0 auto; color: #718096; }
         #progress {
            position: relative;
            flex: 1;
            max-width: 300px;
            height: 14px;
            background: #cbd5e0;
            border-radius: 4px;
            overflow: hidden;
         }
         #progress_text {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 9pt;
            line-height: 14px;
            color: #2d3748;
            margin: 0;
         }
         #progress_fill {
            height: 100%;
            width: 0%;
            background: #48bb78;
            border-radius: 2px;
            transition: width 0.3s;
         }
         #mainrow { display: flex; gap: 10px; height: calc(100vh - 108px); }
         #nav {
            flex: 0 0 280px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 6px;
            overflow: auto;
         }
         #divider {
            flex: 0 0 7px;
            cursor: col-resize;
            background: #eef2f7;
            border-left: 1px solid #cbd5e0;
         }
         #divider:hover { background: #cbd5e0; }
         #content {
            position: relative;
            flex: 1 1 auto;
            font-family: "Cascadia Mono", Consolas, Menlo, monospace;
            font-size: 10pt;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 0;
            overflow: auto;
            white-space: pre;
            counter-reset: ln;
            scroll-behavior: smooth;
         }
         .line { padding: 0 8px 0 0; border-radius: 3px; }
         /* Line numbers: a gutter column, kept, by CSS counters, in sync
            with the file lines: one div.line per source line */
         .line::before {
            counter-increment: ln;
            content: counter(ln);
            display: inline-block;
            width: 3em;
            padding: 0 8px 0 6px;
            margin-right: 10px;
            text-align: right;
            color: #b0b0b0;
            background: #f4f4f4;
            border-right: 1px solid #e4e4e4;
            user-select: none;
            pointer-events: none;
         }
         .hl   { background: #ffef99; }
         .hl::before { background: #ffe27a; color: #5a4a00; font-weight: bold; }
         .fail { background: #ffb3a7; }
         .fence { background: #f6f8fa; }
         .md_h1 { font-weight: bold; font-size: 115%; color: #222; margin-top: 6px; }
         .md_h2 { font-weight: bold; font-size: 108%; color: #333; margin-top: 4px; }
         .md_h3 { font-weight: bold; color: #444; }
         code { background: #eee; padding: 0 3px; border-radius: 2px; font-family: inherit; }
         a.toc { color: #0366d6; text-decoration: none; cursor: pointer; }
         a.toc:hover { text-decoration: underline; }
         .quote { color: #6a737d; font-style: italic; }
         .mm { color: #666; background: #fbfbfd; }
         .mm svg { display: block; margin: 4px 0; max-width: 100%; }
      </style>
   </HEAD>
<BODY>
</BODY>
<noscript>Your browser must support JavaScript and be HTML 5 compliant to see this site.</noscript>
</HTML>
