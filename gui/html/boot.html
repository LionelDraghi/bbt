<!doctype HTML>
<HTML>
   <HEAD>
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>bbt debugger</title>
      <script src="/js/jquery.min.js" type="text/javascript"></script>
      <script src="/js/boot.js" type="text/javascript"></script>
      <script src="/js/mermaid.min.js" type="text/javascript"></script>
      <script src="/js/page.js" type="text/javascript"></script>
      <style>
         /* The page is a flex column: the three header rows are fixed,
            #bottom takes the rest, the terminal a quarter of the
            viewport. No magic height offset. */
         body { font-family: sans-serif; margin: 0; background: #fafafa;
                height: 100vh; display: flex; flex-direction: column; }
         body > div#root { flex: 1 1 auto; min-height: 0;
                           display: flex; flex-direction: column; }
         #root > * { flex: none; }
         #topbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 8px 2px;
         }
         #topbar button, #progressrow button { margin: 0; padding: 2px 10px; }
         /* Stop on error / Auto expand: toggles, green when armed
            (ON), blue when disarmed (OFF, not red: a disarmed switch
            is not a problem) — cf. the POC's #stop_on styling.
            A classic raised/sunken look: ON gets the light border on
            the top/left and the dark one on the bottom/right
            (button up), OFF gets it the other way round (button
            pressed in). */
         #stop_toggle, #auto_expand { font-weight: bold; }
         #stop_toggle.on, #auto_expand.on {
            background: #2f855a;
            border-width: 2px;
            border-style: solid;
            border-top-color: #8fd6a9;
            border-left-color: #8fd6a9;
            border-bottom-color: #1d4a2f;
            border-right-color: #1d4a2f;
         }
         #stop_toggle.on:hover, #auto_expand.on:hover { background: #276749; }
         #stop_toggle.off, #auto_expand.off {
            background: #2b6cb0;
            border-width: 2px;
            border-style: solid;
            border-top-color: #163964;
            border-left-color: #163964;
            border-bottom-color: #7fb3e0;
            border-right-color: #7fb3e0;
         }
         #stop_toggle.off:hover, #auto_expand.off:hover { background: #2a4d7f; }
         /* The progress row: the progress bar and the run status, on
            the left, just under the buttons and above the location
            line. */
         #progressrow {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 1px 8px;
            font-size: 14px;
         }
         #progressrow .status { margin: 0; color: #718096; }
         /* The status bar, editor style: the location line on the
            left, the progress in the middle, run status on the right.
            The POC's #statusbar styling, migrated. */
         #statusbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 1px 8px;
            background: #e2e8f0;
            border-bottom: 1px solid #cbd5e0;
            font-size: 14px;
            line-height: 1.1;
         }
         #statusbar .loc { margin: 0; color: #2d3748; }
         #statusbar .status { margin: 0 0 0 auto; color: #718096; }
         #progress {
            position: relative;
            flex: 1;
            max-width: 300px;
            height: 20px;
            background: #cbd5e0;
            border-radius: 4px;
            overflow: hidden;
         }
         #progress_text {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11pt;
            line-height: 20px;
            color: #2d3748;
            margin: 0;
         }
         #progress_fill {
            height: 100%;
            width: 0%;
            background: #48bb78;
            border-radius: 2px;
            transition: width 0.3s;
         }
         #bottom {
         display: flex;
         flex-direction: column;
         flex: 1 1 auto;
         min-height: 0;
      }
      #bottom #mainrow {
         flex: 1 1 auto;
         min-height: 0;
         display: flex;
         gap: 10px;
      }
      #bottom #terminal {
         flex: 0 0 25vh;
         overflow: auto;
         background: #1e1e1e;
         border-top: 1px solid #cbd5e0;
         font-family: "Cascadia Mono", Consolas, Menlo, monospace;
         font-size: 10pt;
         padding: 4px 0;
      }
      #bottom #terminal .tline {
         color: #d6d6d6;
         padding: 0 8px 0 0;
         border-radius: 3px;
      }
         #nav {
            flex: 0 0 280px;
            display: flex;
            flex-direction: column;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 6px;
            overflow: hidden;
            gap: 6px;
         }
         /* The Auto expand toggle, own header of the tree panel */
         #nav #auto_expand {
            flex: none;
            width: 100%;
            margin: 0;
         }
         /* The tree itself scrolls, not the panel header */
         #nav #navtree { flex: 1 1 auto; overflow: auto; }
         #divider {
            flex: 0 0 7px;
            cursor: col-resize;
            background: #eef2f7;
            border-left: 1px solid #cbd5e0;
         }
         #divider:hover { background: #cbd5e0; }
         /* The terminal panel's height drag handle, between the
            nav + content row and the terminal */
         #tdivider {
            flex: 0 0 7px;
            cursor: row-resize;
            background: #eef2f7;
            border-top: 1px solid #cbd5e0;
         }
         #tdivider:hover { background: #cbd5e0; }
         #content {
            position: relative;
            flex: 1 1 auto;
            font-family: "Cascadia Mono", Consolas, Menlo, monospace;
            font-size: 10pt;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 0;
            overflow: auto;
            white-space: pre;
            counter-reset: ln;
            scroll-behavior: smooth;
         }
         .line { padding: 0 8px 0 0; border-radius: 3px; }
         /* Line numbers: a gutter column, kept, by CSS counters, in sync
            with the file lines: one div.line per source line */
         .line::before {
            counter-increment: ln;
            content: counter(ln);
            display: inline-block;
            width: 3em;
            padding: 0 8px 0 6px;
            margin-right: 10px;
            text-align: right;
            color: #b0b0b0;
            background: #f4f4f4;
            border-right: 1px solid #e4e4e4;
            user-select: none;
            pointer-events: none;
         }
         .hl   { background: #ffef99; }
         .hl::before { background: #ffe27a; color: #5a4a00; font-weight: bold; }
         .fail { background: #ffb3a7; }
         .fence { background: #f6f8fa; }
         .md_h1 { font-weight: bold; font-size: 115%; color: #222; margin-top: 6px; }
         .md_h2 { font-weight: bold; font-size: 108%; color: #333; margin-top: 4px; }
         .md_h3 { font-weight: bold; color: #444; }
         code { background: #eee; padding: 0 3px; border-radius: 2px; font-family: inherit; }
         a.toc { color: #0366d6; text-decoration: none; cursor: pointer; }
         a.toc:hover { text-decoration: underline; }
         .quote { color: #6a737d; font-style: italic; }
         .mm { color: #666; background: #fbfbfd; }
         .mm svg { display: block; margin: 4px 0; max-width: 100%; }
      </style>
   </HEAD>
<BODY>
</BODY>

</HTML>
